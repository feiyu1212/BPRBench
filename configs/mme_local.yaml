data:
  output_dir: data/results/mme_local

model:
  # Base architecture; override per-model via CLI, e.g.
  #   --set model.architecture=conch
  architecture: openclip
  device: cuda
  args:
    arch: ViT-B-32
    # Set via CLI, e.g. --set model.args.checkpoint=$CONCH_CHECKPOINT
    checkpoint: null

eval:
  batch_size: 512
  num_workers: 16
  system_prompt: ""
  force_run: true
  use_cache: false
  # extractor_repair / extractor_max_retries / extractor_retry_backoff_s are
  # VLM-only params; this config targets CLIP encoders, so they stay false/default.
  extractor_repair: false
