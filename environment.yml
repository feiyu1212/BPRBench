# =============================================================================
# BPRBench — unified environment (single env for every model path)
# =============================================================================
# Covers:
#   - CLIP (OpenCLIP / OpenAI CLIP weights)
#   - Vir2-CLIP, QuiltNet, PathGen-CLIP  (OpenCLIP-compatible checkpoints)
#   - CONCH, MUSK                        (upstream git packages)
#   - Quilt-LLaVA                        (local OpenAI-compatible server)
#   - API VLMs                           (openai client: OpenAI/Azure/OpenRouter/local)
#
# Usage:
#   conda env create -f environment.yml
#   conda activate bprbench
#   # quilt-llava must be installed WITHOUT its pinned dependencies: they
#   # (torch==2.0.1, pydantic<2, gradio==3.35.2, timm==0.6.13, ...) conflict
#   # with the versions below. Everything quilt-llava imports at inference
#   # time is already provided by this environment:
#   pip install --no-deps "llava @ git+https://github.com/aldraus/quilt-llava.git@7e70fc39f792ac55de010eb37bff0a6d6f491c13"
#
# Notes:
#   - torch is installed from the cu121 wheels (driver >= 530). On a CPU-only
#     machine, remove the `--extra-index-url` line; torch then falls back to
#     the default CPU build. On other CUDA versions, replace cu121 accordingly.
#   - transformers is pinned to 4.31.x on purpose: quilt-llava subclasses
#     transformers' Llama modeling internals, which changed after 4.31. The
#     benchmark itself only uses XLMRobertaTokenizer, which is identical in
#     4.31 and newer releases.
# =============================================================================
name: bprbench
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip>=24
  - git
  - pip:
      # --- model packages from upstream repositories (pinned commits) ---
      - git+https://github.com/mahmoodlab/CONCH.git@141cc09c7d4ff33d8eda562bd75169b457f71a62
      - git+https://github.com/lilab-stanford/MUSK.git@714b666969c1911e5efe70d991140a21030f4ef3
      # --- pytorch ---
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.2.0
      - torchvision==0.17.0
      # --- vision-language encoders ---
      - transformers==4.31.0
      - tokenizers>=0.11.1,<0.14
      - accelerate==0.21.0
      - sentencepiece==0.2.1
      - open_clip_torch==2.30.0
      - timm==1.0.24
      # --- benchmark core ---
      - numpy==1.26.4
      - pandas==2.0.3
      - pydantic==2.10.6
      - PyYAML==6.0.2
      - python-dotenv==1.0.1
      - tqdm==4.67.1
      - Pillow==10.4.0
      - requests==2.32.5
      # --- VLM client / local server ---
      - openai==1.63.0
      - fastapi==0.128.4
      - uvicorn==0.40.0
      # --- shared model-loading infrastructure ---
      # mpmath is a hard dependency of sympy (pulled in by torch); listing it
      # explicitly keeps the env self-contained even when pip would otherwise
      # satisfy it from a user-site ~/.local install (runner scripts set
      # PYTHONNOUSERSITE=1, which hides user site-packages).
      - mpmath==1.3.0
      - huggingface_hub==0.36.2
      - safetensors==0.7.0
      - fairscale==0.4.13
      - einops==0.8.2
      - ftfy==6.3.1
      - regex==2026.1.15
      - h5py==3.15.1
      - scikit-learn==1.7.2
