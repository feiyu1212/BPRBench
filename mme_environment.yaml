name: mme_env
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.10
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - pillow>=10.0.0
  - numpy>=1.24.0
  - pip
  - pip:
    - open-clip-torch>=2.23.0
    - transformers>=4.30.0,<5
    - sentencepiece
    - timm>=0.9.0
    - einops
    - ftfy
    - regex
    - fairscale
    - pandas>=2.0.0
    - pyyaml>=6.0
    - pydantic>=2.0
    - python-dotenv>=1.0.0
    - tqdm>=4.65.0
    # External MME models
    - git+https://github.com/mahmoodlab/CONCH.git
    - git+https://github.com/lilab-stanford/MUSK.git
